<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Portal Educativo — Acceso</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #e6ecf2;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      background: #0f3d68;
      color: #ffffff;
      padding: 12px 24px;
      border-bottom: 4px solid #1d6fa5;
      font-weight: 600;
      font-size: 16px;
    }
    .main-wrap {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .login-box {
      background: #ffffff;
      width: 100%;
      max-width: 390px;
      border: 1px solid #cbd5e1;
      border-top: 4px solid #0f3d68;
      border-radius: 4px;
      box-shadow: 0 4px 14px rgba(15, 61, 104, 0.08);
      padding: 26px;
    }
    .login-box h2 {
      margin: 0 0 6px 0;
      font-size: 20px;
      color: #0f3d68;
    }
    .login-box p {
      margin: 0 0 18px 0;
      font-size: 13px;
      color: #475569;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-top: 12px;
      color: #334155;
    }
    input {
      width: 100%;
      padding: 9px 10px;
      margin-top: 5px;
      border: 1px solid #94a3b8;
      border-radius: 3px;
      font-size: 14px;
    }
    input:focus {
      outline: none;
      border-color: #0f3d68;
    }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 10px;
      background: #0f3d68;
      color: #ffffff;
      border: none;
      border-radius: 3px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #16538c;
    }
    .error-msg {
      margin-top: 12px;
      padding: 8px 10px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      font-size: 13px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div class="topbar">Portal de Gestión Académica Escolar</div>
  <div class="main-wrap">
    <div class="login-box">
      <h2>Inicio de Sesión</h2>
      <p>Introduce tu cédula y contraseña para acceder a tu perfil.</p>
      <form method="post" action="/login">
        <label for="cedula">Cédula / Usuario</label>
        <input id="cedula" type="text" name="cedula" placeholder="Ej. 01663212J" required />

        <label for="password">Contraseña</label>
        <input id="password" type="password" name="password" placeholder="••••••••" required />

        <button type="submit">Acceder al Portal</button>
      </form>
      {% if error %}
      <div class="error-msg">{{ error }}</div>
      {% endif %}
    </div>
  </div>
</body>
</html>
